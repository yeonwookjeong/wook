    <path d="M30 238 C 18 232, 10 226, 4 216" fill="none" stroke="#8e3720" stroke-width="2.8" stroke-linecap="round"/>
    <use href="#needles" transform="translate(50 176) scale(1.15)"/>
    <use href="#needles" transform="translate(70 258) scale(0.95)"/>
    <use href="#needles" transform="translate(10 212) scale(0.8)"/>
    <use href="#needles" transform="translate(36 236) scale(0.7)"/>
  </g>
  <g transform="translate(390 0) scale(-1 1)">
    <path d="M30 352 C 22 300, 40 268, 30 230 C 24 206, 36 190, 46 176" fill="none" stroke="url(#trunk)" stroke-width="7" stroke-linecap="round"/>
    <path d="M32 286 C 46 278, 58 274, 70 262" fill="none" stroke="#8e3720" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M30 238 C 18 232, 10 226, 4 216" fill="none" stroke="#8e3720" stroke-width="2.8" stroke-linecap="round"/>
    <use href="#needles" transform="translate(50 176) scale(1.15)"/>
    <use href="#needles" transform="translate(70 258) scale(0.95)"/>
    <use href="#needles" transform="translate(10 212) scale(0.8)"/>
    <use href="#needles" transform="translate(36 236) scale(0.7)"/>
  </g>

