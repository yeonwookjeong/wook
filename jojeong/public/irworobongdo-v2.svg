<svg xmlns="http://www.w3.org/2000/svg" width="390" height="420" viewBox="0 0 390 420" preserveAspectRatio="xMidYMax slice">
  <!-- 일월오봉도 (Sun, Moon and Five Peaks): the screen behind every Joseon throne, as a four-panel folding screen.
       Mineral blues and greens (석청·석록) on a deep sky, red-trunked pines, two waterfalls and rolling waves. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2140"/>
      <stop offset="0.55" stop-color="#1d3d5e"/>
      <stop offset="1" stop-color="#2f5f73"/>
    </linearGradient>
    <linearGradient id="peakC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e0c4"/>
      <stop offset="0.18" stop-color="#6fb391"/>
      <stop offset="0.55" stop-color="#2f7b64"/>
      <stop offset="1" stop-color="#173f37"/>
    </linearGradient>
    <linearGradient id="peakS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d6b6"/>
      <stop offset="0.25" stop-color="#58a080"/>
      <stop offset="1" stop-color="#16392f"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3a0"/>
      <stop offset="1" stop-color="#244d4a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6a92"/>
      <stop offset="1" stop-color="#132f52"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d8ecf2" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2416"/>
      <stop offset="0.5" stop-color="#a8432a"/>
      <stop offset="1" stop-color="#6e2416"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0.45" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0.45" stop-color="#fff6dc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunFace" cx="0.4" cy="0.38">
      <stop offset="0" stop-color="#f05a32"/>
      <stop offset="1" stop-color="#b9261a"/>
    </radialGradient>
    <radialGradient id="moonFace" cx="0.4" cy="0.38">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6dcc0"/>
    </radialGradient>
    <!-- silk weave, very faint -->
    <pattern id="silk" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0.5 H4 M0.5 0 V4" stroke="#ffffff" stroke-opacity="0.012" stroke-width="0.6"/>
    </pattern>
    <!-- one wave crest, repeated -->
    <path id="crest" d="M0 8 q7 -11 14 -3 q3 3 0 6 q-3 2 -5 -1" fill="none"/>
    <!-- one pine cluster -->
    <g id="needles">
      <path d="M-26 0 Q0 -14 26 0 Q0 7 -26 0 Z" fill="#1d4a34"/>
      <path d="M-24 -1 Q0 -13 24 -1" fill="none" stroke="#3f7d58" stroke-width="2.2"/>
      <path d="M-18 -2 l3 -4 M-10 -4 l2 -5 M-2 -5 l1 -5 M6 -5 l-1 -5 M14 -4 l-2 -5 M21 -2 l-3 -4" stroke="#6aa57a" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="390" height="420" fill="url(#sky)"/>
  <rect width="390" height="420" fill="url(#silk)"/>

  <!-- moon (left) and sun (right) -->
  <circle cx="98" cy="186" r="44" fill="url(#moonGlow)"/>
  <circle cx="98" cy="186" r="22" fill="url(#moonFace)"/>
  <circle cx="292" cy="186" r="44" fill="url(#sunGlow)"/>
  <circle cx="292" cy="186" r="22" fill="url(#sunFace)"/>

  <!-- far peaks at the edges -->
  <path d="M-30 342 C -5 300, 12 262, 30 256 C 48 262, 70 300, 96 342 Z" fill="url(#peakFar)" stroke="#0e2a28" stroke-width="1.2"/>
  <path d="M294 342 C 320 300, 342 262, 360 256 C 378 262, 395 300, 420 342 Z" fill="url(#peakFar)" stroke="#0e2a28" stroke-width="1.2"/>

  <!-- the centre peak, tallest -->
  <path d="M104 342 C 128 280, 158 176, 195 140 C 232 176, 262 280, 286 342 Z" fill="url(#peakC)" stroke="#0e2a28" stroke-width="1.6"/>
  <g fill="none" stroke="#e8f6ea" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round">
    <path d="M195 146 C 190 180, 182 220, 176 262"/>
    <path d="M195 146 C 202 186, 212 226, 222 270"/>
    <path d="M186 172 C 178 200, 168 228, 160 252"/>
  </g>
  <g fill="none" stroke="#0e2a28" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round">
    <path d="M150 262 q10 -6 20 0 M210 250 q10 -6 20 0 M168 300 q12 -7 24 0 M214 296 q11 -6 22 0"/>
  </g>

  <!-- the two middle peaks -->
  <path d="M14 342 C 40 284, 70 222, 100 206 C 130 222, 158 284, 186 342 Z" fill="url(#peakS)" stroke="#0e2a28" stroke-width="1.5"/>
  <path d="M204 342 C 232 284, 260 222, 290 206 C 320 222, 350 284, 376 342 Z" fill="url(#peakS)" stroke="#0e2a28" stroke-width="1.5"/>
  <g fill="none" stroke="#e8f6ea" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round">
    <path d="M100 212 C 94 240, 86 268, 78 300"/>
    <path d="M100 212 C 108 244, 118 276, 128 306"/>
    <path d="M290 212 C 284 240, 276 268, 268 300"/>
    <path d="M290 212 C 298 244, 308 276, 318 306"/>
  </g>
  <g fill="none" stroke="#0e2a28" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round">
    <path d="M58 300 q9 -6 18 0 M112 292 q9 -6 18 0 M248 300 q9 -6 18 0 M302 292 q9 -6 18 0"/>
  </g>

  <!-- waterfalls between the peaks -->
  <path d="M150 268 q-2 36 1 74 h7 q-3 -38 -2 -74 Z" fill="url(#fall)"/>
  <path d="M234 268 q2 36 -1 74 h-7 q3 -38 2 -74 Z" fill="url(#fall)"/>
  <g fill="#ffffff" fill-opacity="0.7">
    <ellipse cx="154" cy="342" rx="9" ry="2.5"/>
    <ellipse cx="231" cy="342" rx="9" ry="2.5"/>
  </g>

  <!-- pines, red trunks rising at both edges -->
  <g>
    <path d="M30 352 C 22 300, 40 268, 30 230 C 24 206, 36 190, 46 176" fill="none" stroke="url(#trunk)" stroke-width="7" stroke-linecap="round"/>
