# Copy to .github/workflows/collect.yml once youth-hub has its own repository.
# Every 4 hours: collect notices, commit the data if it changed; the host (Cloudflare Pages) rebuilds on push.
name: collect
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: npm run build
      - name: Commit data
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add src/data/collected
          git diff --cached --quiet || (git commit -m "data: 공고 갱신" && git push)
