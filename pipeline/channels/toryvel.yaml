id: toryvel
name: Toryvel (토리블)
track: auto                 # auto = 소재→초안→이미지→발행 전구간 자동
language: ko
bio: "알고 가면 완전히 달라지는 여행, 가기 전에 보는 그곳의 이야기"
positioning: >
  뻔한 정보 나열이 아닌, 장소에 숨겨진 반전 서사와 인과관계를 전하는 여행 아카이브.
  해외/여행지 대상.
targets:
  instagram: toryvel_
  threads: toryvel_
formats:
  - id: carousel
    default: true
    slides: { min: 5, max: 8 }
    ratio: "4:5"
    structure:
      - { role: hook,    count: 1, note: "고정관념을 깨는 반전" }
      - { role: context, count: 3, note: "경제·기술·문화 배경 근거의 시대적 변천사, 시대순" }
      - { role: insight, count: 1, note: "그래서 지금 왜 가야 하는가" }
  - id: utility
    slides: { min: 3, max: 5 }
    note: "라이트업 시간·입장 팁 등 실용 정보. 서사 콘텐츠와 분리 발행"
tone:
  voice: "담백하고 절제된 어조. 단정형 종결."
  banned_phrases:
    - "알고 계셨나요?"
    - "저장 필수"
    - "꼭 가봐야 할"
    - "인생샷"
    - "여러분"
  rules:
    - "슬라이드당 한국어 90자 이내. 스크롤 중 10초 안에 핵심 전달."
    - "각 슬라이드는 볼드 소제목 + 핵심 연도/숫자 키워드를 반드시 포함."
    - "감성 형용사보다 구체적 사실(연도, 금액, 인물명)을 우선."
    - "이모지 사용 금지."
# 토리블 원칙 (연욱님 확정, 2026-11-06)
principles:
  why: "알고 가면 완전히 달라지는 여행. 이걸 알고 가면 몇 배로 재밌어지는 이야기를 준다."
  audience: >
    잡학다식을 원하고, 남에게 말해주고 싶은 지식(지적 허영심)을 좋아하고, 여행을 좋아하는 사람.
    보고 나서 "이거 알아?" 하고 누군가에게 말하고 싶어져야 한다.
  topics:
    - 건축·문화재
    - 역사
    - 트렌드·요즘 문화
    - 맛집·음식의 유래
    - 사람 (그 장소를 만든 인물, 지키는 사람)
    - 동네 (이름의 유래, 동네가 지금 모습이 된 이유)
  rules:
    - "모든 편에 반전 1개 + 인과관계 1개 + '가서 볼 것' 1개를 넣는다."
    - "AI 재현 장면에 화면 표시는 하지 않는다. 대신 업로드할 때 플랫폼의 AI 생성 콘텐츠 표시 항목은 정책대로 체크한다."
    - "'그렇다고 전해진다' 수준의 이야기는 다룰 수 있다. 단정하지 않고, 캡션에 근거의 한계를 한 줄 적는다."

research:
  enabled: true
  query_hints:
    - "landmark original purpose controversy history"
    - "도시 건축물 원래 용도 반전"
    - "관광지 숨겨진 역사 배경"

# 당분간 이 범위만 다룬다. 시즌을 바꾸면 이전 시즌 소재는 뱅크에 남되 뒤로 밀린다.
season:
  id: tokyo-area
  name: 도쿄 · 도쿄 근교
  note: >
    도쿄 여행 전까지 도쿄와 근교(가마쿠라·요코하마·가와고에·하코네·닛코 등)만 판다.
    유명세가 아니라 '왜 지금 이 모습이 되었는가' 가 있는 곳을 고른다.
  query_hints:
    - "東京 名所 意外な歴史 由来"
    - "東京 戦後 空襲 復元 再建"
    - "鎌倉 横浜 川越 箱根 日光 歴史 由来 意外"
    - "東京 地名 由来 江戸"
    - "Tokyo landmark hidden history surprising origin"
