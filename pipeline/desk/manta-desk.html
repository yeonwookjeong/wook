<title>만타 글쓰기 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 왼쪽 장소 목록 + 오른쪽 작업대(재료 → 인터뷰 → 원고), 폰에서는 한 줄로 쌓임 */
:root {
  --bg: #f3f4f1; --paper: #fbfbf9; --ink: #1d2320; --muted: #66706b;
  --line: #d9ddd8; --accent: #2f5d50; --accent-soft: #e2ece8; --warn: #9a4b1c;
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151917; --paper: #1d2220; --ink: #e6ebe8; --muted: #95a09a;
  --line: #333b37; --accent: #8cc4b2; --accent-soft: #233430; --warn: #e3a073; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151917; --paper: #1d2220; --ink: #e6ebe8; --muted: #95a09a;
  --line: #333b37; --accent: #8cc4b2; --accent-soft: #233430; --warn: #e3a073; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); padding-inline: 16px; padding-block: 20px 48px }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 20px; align-items: start }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0,1fr) } }
h1, h2 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0 }
h1 { font-size: 1.5rem } h2 { font-size: 1.15rem }
.eyebrow { font-size: .72rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase }
.muted { color: var(--muted) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px }
button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 600 }
button:disabled { opacity: .5; cursor: default }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, textarea { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px }
textarea { resize: vertical; min-height: 84px }
label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted) }

aside { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
@media (max-width: 820px) { aside { position: static } }
.list { display: grid; gap: 4px }
.item { text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; display: grid; gap: 1px }
.item.on { background: var(--accent-soft) }
.item b { font-weight: 600 } .item span { font-size: .8rem; color: var(--muted) }

main { display: grid; gap: 18px; min-width: 0 }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.step { font-family: var(--display); color: var(--accent); font-size: .9rem }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.ph { display: grid; gap: 6px; font-size: .82rem }
.ph img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: var(--line) }
.ph .n { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600 }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted) }
.drop.over { border-color: var(--accent); color: var(--accent) }
.chat { display: grid; gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 4px }
.msg { padding: 10px 12px; border-radius: 10px; max-width: 88%; white-space: pre-wrap; word-break: keep-all }
.msg.q { background: var(--accent-soft) } .msg.a { background: var(--bg); justify-self: end }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row > textarea { flex: 1 1 260px; min-height: 60px }
.draft { white-space: pre-wrap; word-break: keep-all; background: var(--bg); border-radius: 10px; padding: 16px; line-height: 1.85; max-height: 640px; overflow-y: auto }
.status { font-size: .82rem; color: var(--muted) } .status.err { color: var(--warn) }
.empty { text-align: center; padding: 48px 16px; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { button { transition: background .15s } }
</style>

<div class="wrap">
  <aside>
    <div><div class="eyebrow">MANTA · 네이버 블로그</div><h1>글쓰기 데스크</h1></div>
    <button class="primary" id="newPlace">+ 새 장소</button>
    <div class="list" id="list"><p class="muted" id="listEmpty">아직 장소가 없어요. 위 버튼으로 첫 장소를 만드세요.</p></div>
    <p class="status" id="conn">연결 중…</p>
  </aside>

  <main id="main">
    <div class="panel empty" id="noSel">
      <h2>장소를 고르거나 새로 만드세요</h2>
      <p>장소 하나가 글 한 편이 됩니다. 사진과 메모를 넣고, 질문에 답하면 초안이 나옵니다.</p>
    </div>

    <section class="panel" id="s1" hidden>
      <div class="head"><h2><span class="step">재료 ·</span> 장소와 사진</h2><button id="delPlace">장소 삭제</button></div>
      <div id="delConfirm" class="row" hidden><span class="status err">이 장소와 대화·원고를 지웁니다.</span><button id="delYes">삭제</button><button id="delNo">취소</button></div>
      <div class="grid2">
        <label for="f-name">장소 이름<input id="f-name" placeholder="예: 아메요코 시장"></label>
        <label for="f-area">지역<input id="f-area" placeholder="예: 도쿄 우에노"></label>
        <label for="f-date">방문 날짜<input id="f-date" type="date"></label>
      </div>
      <label for="f-memo">기억나는 것 (짧게 막 적어도 돼요)<textarea id="f-memo" placeholder="예: 비 오는 오후, 생선가게 아저씨가 시식 줌. 생각보다 좁고 시끄러움."></textarea></label>
      <div class="drop" id="drop">사진을 끌어놓거나 <button id="pick">사진 고르기</button><input id="file" type="file" accept="image/*" multiple hidden>
        <div class="status" id="upStatus"></div></div>
      <div class="photos" id="photos"></div>
    </section>

    <section class="panel" id="s2" hidden>
      <div class="head"><h2><span class="step">인터뷰 ·</span> 빈 곳 채우기</h2><button id="ask">질문 받기</button></div>
      <p class="muted">메모와 사진을 보고 글에 필요한데 빠진 것을 물어봐요. 답한 내용만 사실로 씁니다.</p>
      <div class="chat" id="chat"></div>
      <div class="row"><textarea id="answer" placeholder="답하기 (Enter 전송, Shift+Enter 줄바꿈)"></textarea><button class="primary" id="send">보내기</button></div>
    </section>

    <section class="panel" id="s3" hidden>
      <div class="head"><h2><span class="step">원고 ·</span> 블로그 초안</h2>
        <div class="row"><button class="primary" id="write">초안 쓰기</button><button id="copy">복사</button></div></div>
      <div class="draft" id="draft"><span class="muted">재료와 인터뷰가 어느 정도 모이면 초안을 써보세요.</span></div>
      <div class="row"><textarea id="fix" placeholder="고칠 점: 예) 도입을 더 짧게, 가격 정보 빼줘"></textarea><button id="revise">고쳐 쓰기</button></div>
      <p class="status" id="aiStatus"></p>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let db = null, assets = null, sample = null, uid = null;
let places = [], cur = null, busy = false;
const files = new Map(); // 이번 세션에 올린 원본 사진 (사진 설명 생성용)

const TONE = `만타 블로그 톤:
- 1인칭 회고체, 힘 뺀 솔직한 기록. 짧은 문장. 과장·광고 문투 금지 ("강추", "인생샷", "내돈내산", "안 가면 후회" 금지).
- 정보 나열보다 그 장소에서 있었던 장면과 그때의 판단을 쓴다.
- 사실은 메모·사진 설명·인터뷰 답에 있는 것만. 가격·시간·위치를 지어내지 않는다. 모르면 쓰지 않는다.
- 네이버 블로그 형식: 제목에 지역명+장소명, 소제목은 "■ " 로 시작, 3~4문장마다 [사진 n] 자리 표시(n은 사진 번호).
- 끝에 "가는 법 / 머문 시간 / 쓴 돈" 정리는 확인된 항목만.`;

function material(p) {
  const ph = (p.photos || []).map((x, i) => `[사진 ${i + 1}] ${x.caption || "(설명 없음)"}`).join("\n") || "(사진 없음)";
  const qa = (p.chat || []).map(m => (m.role === "q" ? "질문: " : "답: ") + m.text).join("\n") || "(아직 없음)";
  return `장소: ${p.name || "(미정)"}\n지역: ${p.area || "-"}\n날짜: ${p.date || "-"}\n메모: ${p.memo || "-"}\n\n사진:\n${ph}\n\n인터뷰:\n${qa}`;
}

/* ---------- 연결 ---------- */
(async () => {
  const user = await claude.use("user");
  db = await claude.use("db");
  if (!db || !user) { $("conn").textContent = "저장소에 연결할 수 없어요. claude.ai에 로그인한 상태로 열어주세요."; $("conn").className = "status err"; return; }
  uid = await user.id();
  assets = await claude.use("assets");
  sample = await claude.use("sample");
  if (!assets) { $("drop").hidden = true; }
  if (!sample) { ["ask", "send", "write", "revise"].forEach(id => $(id).disabled = true); $("aiStatus").textContent = "이 화면에서는 Claude를 부를 수 없어요."; }
  $("conn").textContent = "저장됨 · 내 계정에만 보여요";
  db.collection("data/users/" + uid).onSnapshot(snap => {
    places = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.kind === "place")
      .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
    renderList();
    if (cur) { const fresh = places.find(p => p.id === cur.id); if (fresh) { cur = fresh; renderPlace(false); } else select(null); }
  }, e => { $("conn").textContent = "불러오기 실패: " + e.code; $("conn").className = "status err"; });
})();

function ref(id) { return db.collection("data/users/" + uid).doc(id); }
async function save(patch) {
  if (!cur) return;
  Object.assign(cur, patch, { updatedAt: new Date().toISOString() });
  const { id, ...data } = cur;
  try { await ref(id).set(data); } catch (e) { setStatus("저장 실패: " + e.code, true); }
}

/* ---------- 목록 ---------- */
function renderList() {
  const list = $("list"); list.querySelectorAll(".item").forEach(n => n.remove());
  $("listEmpty").hidden = places.length > 0;
  for (const p of places) {
    const b = document.createElement("button"); b.className = "item" + (cur?.id === p.id ? " on" : "");
    const t = document.createElement("b"); t.textContent = p.name || "이름 없는 장소";
    const s = document.createElement("span"); s.textContent = [p.area, p.date, p.draft ? "초안 있음" : ""].filter(Boolean).join(" · ") || "재료 모으는 중";
    b.append(t, s); b.onclick = () => select(p.id); list.append(b);
  }
}
$("newPlace").onclick = async () => {
  if (!db) return;
  const r = db.collection("data/users/" + uid).doc();
  const data = { kind: "place", name: "", area: "", date: "", memo: "", photos: [], chat: [], draft: "", updatedAt: new Date().toISOString() };
  await r.set(data); cur = { id: r.id, ...data }; places.unshift(cur); renderList(); renderPlace(true); $("f-name").focus();
};
function select(id) { cur = id ? places.find(p => p.id === id) : null; renderList(); renderPlace(true); }

/* ---------- 작업대 ---------- */
function renderPlace(fillInputs) {
  const on = !!cur; ["s1", "s2", "s3"].forEach(s => $(s).hidden = !on); $("noSel").hidden = on; $("delConfirm").hidden = true;
  if (!on) return;
  if (fillInputs) { $("f-name").value = cur.name || ""; $("f-area").value = cur.area || ""; $("f-date").value = cur.date || ""; $("f-memo").value = cur.memo || ""; }
  const ph = $("photos"); ph.textContent = "";
  (cur.photos || []).forEach((x, i) => {
    const c = document.createElement("div"); c.className = "ph";
    const img = document.createElement("img"); img.src = "/_blob/" + x.id; img.alt = x.caption || ""; img.loading = "lazy";
    const n = document.createElement("span"); n.className = "n"; n.textContent = "사진 " + (i + 1);
    const cap = document.createElement("input"); cap.id = "cap-" + x.id; cap.value = x.caption || ""; cap.placeholder = "무슨 장면인지";
    cap.onchange = () => { cur.photos[i].caption = cap.value; save({ photos: cur.photos }); };
    c.append(img, n, cap); ph.append(c);
  });
  const chat = $("chat"); chat.textContent = "";
  (cur.chat || []).forEach(m => { const d = document.createElement("div"); d.className = "msg " + m.role; d.textContent = m.text; chat.append(d); });
  if (!cur.chat?.length) { const d = document.createElement("p"); d.className = "muted"; d.textContent = "'질문 받기'를 누르면 시작해요."; chat.append(d); }
  chat.scrollTop = chat.scrollHeight;
  if (cur.draft) $("draft").textContent = cur.draft;
  else $("draft").innerHTML = '<span class="muted">재료와 인터뷰가 어느 정도 모이면 초안을 써보세요.</span>';
}
for (const [id, key] of [["f-name", "name"], ["f-area", "area"], ["f-date", "date"], ["f-memo", "memo"]])
  $(id).addEventListener("change", e => save({ [key]: e.target.value }));

$("delPlace").onclick = () => $("delConfirm").hidden = false;
$("delNo").onclick = () => $("delConfirm").hidden = true;
$("delYes").onclick = async () => { const id = cur.id; select(null); try { await ref(id).delete(); } catch (e) { setStatus("삭제 실패: " + e.code, true); } };

/* ---------- 사진 ---------- */
$("pick").onclick = () => $("file").click();
$("file").onchange = e => upload([...e.target.files]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))); };

async function upload(list) {
  if (!assets || !cur || !list.length) return;
  const up = $("upStatus"); const added = [];
  for (const [i, f] of list.entries()) {
    up.textContent = `올리는 중 ${i + 1}/${list.length}…`;
    try { const r = await assets.upload(f); files.set(r.id, f); added.push({ id: r.id, caption: "" }); }
    catch (e) { up.textContent = `${f.name} 업로드 실패 (${e.code})`; up.className = "status err"; }
  }
  if (!added.length) return;
  await save({ photos: [...(cur.photos || []), ...added] }); renderPlace(false);
  up.className = "status"; up.textContent = "사진 설명을 만드는 중…";
  await describe(added); up.textContent = "";
}
async function describe(added) {
  const caps = sample ? await sample.limits().catch(() => null) : null;
  if (!caps?.images) return;
  const max = caps.images.maxCount || 1;
  for (let i = 0; i < added.length; i += max) {
    const batch = added.slice(i, i + max);
    try {
      const out = await sample.json(`여행 블로그용 사진 ${batch.length}장입니다. 각 사진에 무엇이 보이는지 한국어 한 문장으로 적으세요. 장소 이름이나 위치는 추측하지 말고 보이는 것만. JSON 배열(문자열 ${batch.length}개)로만 답하세요.`,
        { images: batch.map(b => files.get(b.id)), modelTier: "quick" });
      if (Array.isArray(out)) batch.forEach((b, k) => { const p = cur.photos.find(x => x.id === b.id); if (p && !p.caption) p.caption = String(out[k] || ""); });
    } catch (e) { if (e.code === "not_granted") return; }
  }
  await save({ photos: cur.photos }); renderPlace(false);
}

/* ---------- 인터뷰 ---------- */
async function ask() {
  if (!sample || !cur || busy) return;
  await run("질문을 고르는 중…", async () => {
    const r = await sample(`당신은 블로그 글 인터뷰어입니다. 아래 재료로 장소 하나에 대한 블로그 글을 쓰려고 합니다.
글에 꼭 필요한데 빠진 것을 골라 질문 1~2개만 하세요. 이미 답한 것은 다시 묻지 마세요.
감각(소리·냄새·날씨), 그 장소에 간 이유, 기억에 남는 장면, 실용 정보(가는 법·머문 시간·쓴 돈) 중 비어 있는 쪽을 우선합니다.
반말 말고 해요체로, 질문만 짧게 쓰세요. 충분히 모였으면 "이제 초안을 써도 될 것 같아요."라고만 답하세요.

${material(cur)}`, { cache: false });
    cur.chat = [...(cur.chat || []), { role: "q", text: r.text.trim() }]; await save({ chat: cur.chat }); renderPlace(false);
  });
}
$("ask").onclick = ask;
async function send() {
  const t = $("answer").value.trim(); if (!t || !cur) return;
  $("answer").value = ""; cur.chat = [...(cur.chat || []), { role: "a", text: t }]; await save({ chat: cur.chat }); renderPlace(false); ask();
}
$("send").onclick = send;
$("answer").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

/* ---------- 원고 ---------- */
$("write").onclick = () => write(`아래 재료로 네이버 블로그 글을 쓰세요. 분량 1,500~2,500자.\n\n${TONE}\n\n${material(cur)}\n\n글만 출력하세요. 첫 줄은 제목.`);
$("revise").onclick = () => {
  const f = $("fix").value.trim(); if (!f || !cur?.draft) return;
  write(`아래 블로그 초안을 요청대로 고치세요. 요청과 무관한 부분은 그대로 둡니다.\n\n요청: ${f}\n\n${TONE}\n\n재료(사실 확인용):\n${material(cur)}\n\n현재 초안:\n${cur.draft}\n\n고친 글 전체만 출력하세요.`, () => $("fix").value = "");
};
async function write(prompt, after) {
  if (!sample || !cur || busy) return;
  await run("쓰는 중…", async () => {
    const r = await sample(prompt, { modelTier: "complex", cache: false, onText: ({ text }) => { $("draft").textContent = text; } });
    await save({ draft: r.text.trim() }); renderPlace(false); after?.();
    if (r.truncated) setStatus("글이 길어서 끝이 잘렸어요. '더 짧게'로 고쳐 쓰기 해보세요.", true);
  });
}
$("copy").onclick = async () => {
  if (!cur?.draft) return;
  try { await navigator.clipboard.writeText(cur.draft); setStatus("복사했어요. 네이버 글쓰기에 붙여넣으세요."); }
  catch { const r = document.createRange(); r.selectNodeContents($("draft")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setStatus("선택해뒀어요. Ctrl/⌘+C로 복사하세요."); }
};

async function run(label, fn) {
  busy = true; ["ask", "send", "write", "revise"].forEach(id => $(id).disabled = true); setStatus(label);
  try { await fn(); setStatus(""); }
  catch (e) {
    setStatus(e.code === "not_granted" ? "Claude 사용이 허용되지 않았어요. 아티팩트 권한 메뉴에서 켤 수 있어요."
      : e.code === "rate_limited" ? "잠깐 너무 많이 불렀어요. 조금 뒤에 다시 눌러주세요." : "실패했어요: " + (e.message || e.code), true);
  } finally { busy = false; if (sample) ["ask", "send", "write", "revise"].forEach(id => $(id).disabled = false); }
}
function setStatus(t, err) { const s = $("aiStatus"); s.textContent = t; s.className = "status" + (err ? " err" : ""); }
</script>
