<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#111}
canvas{position:absolute;inset:0}
#cap{position:absolute;left:24px;right:24px;top:74%;text-align:center;font:700 32px "WenQuanYi Zen Hei",sans-serif;color:#fff;line-height:1.35;word-break:keep-all;text-shadow:0 0 6px rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.95)}
#era{position:absolute;left:24px;top:6%;font:700 19px "WenQuanYi Zen Hei",sans-serif;color:#f3e9d2;background:rgba(0,0,0,.45);padding:6px 12px;opacity:0}
#card{position:absolute;left:0;right:0;top:12%;text-align:center;font:700 84px "WenQuanYi Zen Hei",sans-serif;color:#f3e9d2;opacity:0;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#credit{position:absolute;right:12px;bottom:10px;font:11px sans-serif;color:rgba(255,255,255,.7)}
#book{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:110px;box-sizing:border-box;gap:20px}
#book .title{flex-shrink:0;box-sizing:border-box;text-align:center;line-height:1.05;font:700 42px "WenQuanYi Zen Hei",serif;color:#2b241c;letter-spacing:6px;background:#e8dcc2;padding:34px 22px;box-shadow:0 18px 40px rgba(0,0,0,.6);border-left:10px solid #7a2e22}
#book .meta{font:700 22px "WenQuanYi Zen Hei",sans-serif;color:#e8dcc2;letter-spacing:2px}
#book .none{font:700 30px "WenQuanYi Zen Hei",sans-serif;color:#fff;background:#c45c3e;padding:8px 16px;opacity:0}
#book .row{font:700 40px "WenQuanYi Zen Hei",sans-serif;padding:14px 26px;border:3px solid #e8dcc2;color:#e8dcc2;opacity:0;position:relative}
#book .row.x{text-decoration:line-through;text-decoration-thickness:4px;color:#9b8f7a;border-color:#6b6255}
#book .row.o{background:#c45c3e;border-color:#f3e9d2;color:#fff}
#hts{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:130px;box-sizing:border-box;gap:18px;opacity:0}
#hts .h{font:700 34px "WenQuanYi Zen Hei",sans-serif;color:#2b241c;background:#e8dcc2;padding:10px 22px;opacity:0;box-shadow:0 10px 24px rgba(0,0,0,.5)}
#hts .meta2{font:700 22px "WenQuanYi Zen Hei",sans-serif;color:#e8dcc2;margin-top:10px;letter-spacing:2px}
#br{position:absolute;border:2px solid rgba(255,255,255,.9);border-left:none;width:8px;opacity:0}
#brl{position:absolute;opacity:0;transform:translate(0,-50%);color:#fff;font:700 15px "WenQuanYi Zen Hei",sans-serif;padding:3px 7px;background:rgba(196,92,62,.95);white-space:nowrap}
</style></head><body>
<canvas id="c" width="540" height="960"></canvas>
<div id="book"><div class="row x">공식 기록</div><div class="row o">해체업자의 증언</div><div class="meta">生方幸夫『解体屋の戦後史』 1994</div></div><div id="hts"><div class="h">대전망대 위</div><div class="h">특별전망대 위</div><div class="h">100m 위 · 1,000~1,500톤</div><div class="meta2">책마다 다르게 적힌 높이</div></div>
<div id="br"></div><div id="brl">윗부분</div>
<div id="era"></div><div id="card"></div><div id="cap"></div><div id="credit"></div>
<script>
const W=540,H=960,cv=document.getElementById('c'),g=cv.getContext('2d');
const L=f=>{const i=new Image();i.onload=()=>ready++;i.src=f;return i};let ready=0;
const IM={tA:L('tankA.jpg'),tB:L('tankB.jpg'),night:L('night.jpg'),a60:L('aer60.jpg')};
window.isReady=()=>ready===4;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),lerp=(a,b,x)=>a+(b-a)*x;
const D=[2.112000,2.040000,4.080000,2.304000,4.608000,3.696000,2.040000,3.840000],G=0.3;const ST=[];{let s=0;for(const d of D){ST.push(s);s+=d+G;}window.TOTAL=s;}
const LINES=[['전차로 탑을 짓는다고요?'],['전차 철갑은','질 좋은 특수강이거든요.'],['녹이고 펴서 철골로 만든 뒤,','탑의 윗부분으로 올렸습니다.'],['그런데 반전은 따로 있습니다.'],['이 이야기는 공식 기록이 아니라,','전차를 해체한 업자 쪽에서','나온 증언입니다.'],['그래서 책마다,','들어간 높이도','조금씩 다르게 적혀 있죠.'],['그래서 지금도 이렇게 말합니다.'],['도쿄 야경 꼭대기엔,','한국전쟁을 지나온 전차가','서 있다고.']];
// 사진 그리기: 화면을 덮도록 맞춘 뒤 (cx,cy) 중심, 배율 z
function cover(img,cx,cy,z,filter){const s=Math.max(W/img.width,H/img.height)*z;g.filter=filter||'none';
 g.drawImage(img,W/2-cx*img.width*s,H/2-cy*img.height*s,img.width*s,img.height*s);g.filter='none';return s;}
const grain=document.createElement('canvas');grain.width=W;grain.height=H;
function drawGrain(t,a){const gg=grain.getContext('2d'),im=gg.createImageData(W,H);let s=Math.floor(t*24)*9973;
 for(let i=0;i<im.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=(s>>16)&255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=a;}gg.putImageData(im,0,0);g.drawImage(grain,0,0);}
function shade(){const bg=g.createLinearGradient(0,H*0.62,0,H);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(.35,'rgba(0,0,0,.55)');bg.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=bg;g.fillRect(0,H*.62,W,H*.38);
 const vg=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=vg;g.fillRect(0,0,W,H);}
// 야경 사진 속 탑 좌표 (원본 비율)
const TX=0.578,TIP=0.08,DECK=0.555;
function night(cx,cy,z,hl,dark){const s=cover(IM.night,cx,cy,z);
 const X=u=>W/2-cx*IM.night.width*s+u*IM.night.width*s, Y=v=>H/2-cy*IM.night.height*s+v*IM.night.height*s;
 if(hl>0||dark>0){g.fillStyle=`rgba(0,0,0,${Math.max(hl*0.6,dark)})`;g.fillRect(0,0,W,H);}
 if(hl>0){g.save();g.beginPath();g.moveTo(X(TX-0.004),Y(TIP-0.01));g.lineTo(X(TX+0.004),Y(TIP-0.01));g.lineTo(X(TX+0.05),Y(DECK+0.01));g.lineTo(X(TX-0.05),Y(DECK+0.01));g.closePath();g.clip();
  g.globalAlpha=hl;cover(IM.night,cx,cy,z,'brightness(1.25) saturate(1.2)');g.globalAlpha=1;g.restore();}
 return {X,Y};}
window.renderAt=function(t){
  let i=0;for(let j=0;j<D.length;j++)if(t>=ST[j])i=j;const lt=t-ST[i],ld=D[i]+G;
  const era=document.getElementById('era'),card=document.getElementById('card'),cr=document.getElementById('credit'),book=document.getElementById('book'),br=document.getElementById('br'),brl=document.getElementById('brl');
  era.style.opacity=0;card.style.opacity=0;book.style.opacity=0;document.getElementById('hts').style.opacity=0;br.style.opacity=0;brl.style.opacity=0;cr.textContent='';
  g.fillStyle='#111';g.fillRect(0,0,W,H);
  if(i<=1){ // 6–7: 실제 전차 사진 (줄 6~7 한 장면으로)
    const T0=ST[0],T1=ST[2],a=ease((t-T0)/(T1-T0));
    cover(IM.tA,lerp(0.55,0.62,a),lerp(0.5,0.45,a),lerp(1.0,1.45,a),'sepia(.2) contrast(1.05)');
    era.textContent='한국전쟁 당시 미군 M4 셔먼';era.style.opacity=ease((t-T0)/0.4);
    if(i===1){card.textContent='특수강';card.style.opacity=ease((lt-0.2)/0.3);}
    cr.textContent='사진: 미국 국립기록관리청(퍼블릭 도메인)';
  } else if(i===2){ // 8: 1960년대 항공사진 → 지금 야경 윗부분
    if(lt<1.7){const a=ease(lt/1.7);const s=cover(IM.a60,0.5,lerp(0.52,0.552,a),lerp(1.4,2.6,a),'sepia(.25)');
      era.textContent='1960년대 · 같은 자리, 탑이 섰다';era.style.opacity=1;cr.textContent='출처: 국토지리원 공중사진(1961~1969) 가공';
      const px=W/2,py=H/2+(0.552-lerp(0.52,0.552,a))*IM.a60.height*s;const pu=(lt*1.4)%1;
      g.beginPath();g.arc(px,py,10+26*pu,0,7);g.strokeStyle=`rgba(243,233,210,${1-pu})`;g.lineWidth=2;g.stroke();g.beginPath();g.arc(px,py,7,0,7);g.fillStyle='#c45c3e';g.fill();}
    else{const b=ease((lt-1.7)/(ld-1.7));const o=night(TX,lerp(0.36,0.32,b),lerp(1.35,1.55,b),ease((lt-1.9)/0.4),0);
      const x=o.X(TX+0.06),y1=o.Y(TIP),y2=o.Y(DECK);br.style.left=x+'px';br.style.top=y1+'px';br.style.height=(y2-y1)+'px';brl.style.left=(x+14)+'px';brl.style.top=((y1+y2)/2)+'px';
      const bo=ease((lt-2.1)/0.3);br.style.opacity=bo;brl.style.opacity=bo;cr.textContent='사진: 福原邦展 / CC BY 3.0';}
    if(lt>1.5&&lt<1.9){g.fillStyle=`rgba(255,255,255,${0.35*(1-Math.abs(lt-1.7)/0.2)})`;g.fillRect(0,0,W,H);}
  } else if(i===3){ // 9: 멈추고 어둡게
    const o=night(TX,0.32,1.55+0.03*ease(lt/ld),1,0.55*ease(lt/0.5));cr.textContent='사진: 福原邦展 / CC BY 3.0';
  } else if(i===4){ // 10: 출처 카드
    g.fillStyle='#1b1714';g.fillRect(0,0,W,H);
    book.style.opacity=ease(lt/0.3);const rows=book.querySelectorAll('.row');rows[0].style.opacity=ease((lt-0.2)/0.3);rows[1].style.opacity=ease((lt-1.6)/0.3);
    book.querySelector('.meta').style.opacity=ease((lt-2.2)/0.3);
  } else if(i===5){ // 11: 책마다 다른 높이 (전차 사진 위)
    const a=ease(lt/ld);cover(IM.tB,lerp(0.45,0.55,a),0.6,lerp(1.1,1.3,a),'sepia(.2) contrast(1.05) brightness(.55)');
    const hs=document.getElementById('hts');hs.style.opacity=1;hs.querySelectorAll('.h').forEach((e,k)=>{e.style.opacity=ease((lt-0.2-k*0.5)/0.3);});
    cr.textContent='사진: 미 해군(퍼블릭 도메인)';
  } else { // 12–13: 야경, 아래에서 꼭대기로
    const T0=ST[6],a=ease((t-T0)/(window.TOTAL-T0));night(TX,lerp(0.62,0.22,a),lerp(1.2,1.6,a),0,0);cr.textContent='사진: 福原邦展 / CC BY 3.0';
    const f=ease((t-(window.TOTAL-0.5))/0.5);if(f>0){g.fillStyle=`rgba(0,0,0,${f})`;g.fillRect(0,0,W,H);}
  }
  shade();drawGrain(t,i===4?10:15);
  let cap='';if(lt<ld){const parts=LINES[i],tot=parts.join('').length;let acc=0;for(const p of parts){acc+=p.length;cap=p;if(lt<D[i]*acc/tot+0.05)break;}}
  document.getElementById('cap').innerHTML=t>window.TOTAL-0.4?'':cap;
};
</script></body></html>
