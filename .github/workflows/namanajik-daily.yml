name: namanajik-daily
on:
  schedule:
    - cron: "30 18 * * *"   # 매일 03:30 KST
  workflow_dispatch:
    inputs:
      map_year:
        description: "영상 매핑도 함께 실행할 연도 (비우면 수집만)"
        required: false
permissions:
  contents: write
concurrency: namanajik-daily
jobs:
  collect:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: namanajik } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 영상 매핑 (수동 실행 시에만)
        if: ${{ github.event.inputs.map_year != '' }}
        run: node scripts/map-videos.js ${{ github.event.inputs.map_year }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_SEARCHES_PER_RUN: "95"
      - name: 조회수 스냅샷
        run: node scripts/snapshot.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 순위 계산
        run: node scripts/rank.js
      - name: 커밋
        run: |
          git config user.name "namanajik-bot"
          git config user.email "namanajik-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "data: $(date -u +%F) 스냅샷·순위" && git push)
