name: pipeline · 배치 제작

# 주 1회 배치 제작일. 소재 뱅크를 채우고 auto 트랙 채널의 초안 + 캐러셀 이미지를 만들어 PR 로 올린다.
# PR 을 머지하는 행위가 곧 발행 승인이다.
on:
  schedule:
    - cron: '0 0 * * 1'      # 매주 월요일 09:00 KST
  workflow_dispatch:
    inputs:
      channels:
        description: '대상 채널 (쉼표 구분). 비우면 auto 트랙 전체'
        required: false
        default: ''
      ideas_per_channel:
        description: '채널당 새로 뽑을 소재 수'
        required: false
        default: '6'

concurrency:
  group: pipeline-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 소재 뱅크 채우기 + 초안 생성 + 렌더
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          CHANNELS="${{ inputs.channels }}"
          if [ -z "$CHANNELS" ]; then CHANNELS="toryvel,halgeo,naver"; fi
          for ch in ${CHANNELS//,/ }; do
            echo "::group::$ch"
            npm run --silent pipe -- ideas --channel "$ch" -n "${{ inputs.ideas_per_channel || 6 }}"
            npm run --silent pipe -- draft --channel "$ch"
            echo "::endgroup::"
          done
          npm run --silent pipe -- render
          npm run --silent pipe -- status

      - name: PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          BRANCH="pipeline/batch-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pipeline/content pipeline/rendered pipeline/data
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — PR 을 만들지 않습니다."
            exit 0
          fi
          git commit -m "chore(pipeline): 배치 제작 $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "콘텐츠 배치 $(date -u +%Y-%m-%d)" \
            --body "$(npm --prefix pipeline run --silent pipe -- status)

머지하면 각 콘텐츠의 \`publishAt\` 시각에 자동 발행됩니다.
내리고 싶은 건은 해당 파일을 지우거나 \`publishAt\` 을 비우고 머지하세요." \
            --base "${{ github.event.repository.default_branch }}"
